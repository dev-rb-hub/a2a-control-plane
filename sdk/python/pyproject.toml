[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-control-plane"
version = "0.1.0.dev0"
description = "Python SDK for the a2a-control-plane open standard: identity, topology, subjects, worker state machine, and delta-state streaming."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dev-rb-hub" }]
keywords = ["a2a", "multi-agent", "control-plane", "zero-trust", "spiffe", "nats", "protobuf"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["protobuf>=6.31", "cryptography>=42"]

[project.optional-dependencies]
a2a = ["a2a-sdk>=1.2"]
crewai = ["crewai"]
dev = ["pytest>=8", "grpcio-tools==1.76.0", "ruff>=0.6", "mypy>=1.11", "types-protobuf", "a2a-sdk>=1.2"]

[project.urls]
Homepage = "https://github.com/dev-rb-hub/a2a-control-plane"
Specification = "https://github.com/dev-rb-hub/a2a-control-plane/tree/main/spec"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/a2a_control_plane/_proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["crewai", "a2a"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["src/a2a_control_plane/_proto"]

[[tool.mypy.overrides]]
# Optional, untyped dependency; the integration is scaffolding until it is implemented.
module = ["crewai", "crewai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "a2a_control_plane.integrations.crewai.*"
disallow_subclassing_any = false
